name: Test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintassi dello script della pagina
        run: |
          node -e "const s=require('fs').readFileSync('index.html','utf8');require('fs').writeFileSync('/tmp/app.js',s.slice(s.indexOf('<script>')+8,s.lastIndexOf('</script>')))"
          node --check /tmp/app.js
      - name: Test delle parti pure
        run: node tests/run.mjs
